# ══════════════════════════════════════════════════════════════
# FluffNwoof - CI Pipeline
# Automated testing, linting, and building
# ══════════════════════════════════════════════════════════════

name: CI Pipeline

on:
  push:
    branches: [main, develop, training, 'release/**']
  pull_request:
    branches: [main, develop, training]

env:
  NODE_VERSION: '20'

# Prevent concurrent runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════
  # Code Quality & Security
  # ════════════════════════════════════════════════════════════════
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Lint Backend
        run: cd backend && npm run lint || true

      - name: Lint Frontend
        run: cd frontend && npm run lint || true

      - name: TypeScript Check (Backend)
        run: cd backend && npx prisma generate && npx tsc --noEmit

      - name: TypeScript Check (Frontend)
        run: cd frontend && npx tsc --noEmit

  # ════════════════════════════════════════════════════════════════
  # Security Audit
  # ════════════════════════════════════════════════════════════════
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (Backend)
        run: cd backend && npm audit --audit-level=high || true

      - name: Run npm audit (Frontend)
        run: cd frontend && npm audit --audit-level=high || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ════════════════════════════════════════════════════════════════
  # Backend Tests
  # ════════════════════════════════════════════════════════════════
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: cd backend && npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: Run Migrations
        run: cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db

      - name: Run Tests with Coverage
        run: cd backend && npm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          JWT_SECRET: test-secret-key-for-testing

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  # ════════════════════════════════════════════════════════════════
  # Frontend Tests
  # ════════════════════════════════════════════════════════════════
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Run Tests
        run: cd frontend && npm test --if-present || echo "No tests configured yet"

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: https://api.example.com/api

  # ════════════════════════════════════════════════════════════════
  # NOTE: The "Build Docker Images" job was removed. Render deploys via
  # deploy hooks (native build) and does not consume CI-built Docker
  # images, so building/pushing them here was unused and only added a
  # failing, resource-heavy step. See .github/workflows/deploy.yml.
  # ════════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════════
  # Summary
  # ════════════════════════════════════════════════════════════════
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, security, test-backend, test-frontend]
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "Quality: ${{ needs.quality.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Backend Tests: ${{ needs.test-backend.result }}"
          echo "Frontend Tests: ${{ needs.test-frontend.result }}"

          if [[ "${{ needs.quality.result }}" == "failure" ]] || \
             [[ "${{ needs.test-backend.result }}" == "failure" ]] || \
             [[ "${{ needs.test-frontend.result }}" == "failure" ]]; then
            echo "CI Pipeline has failures"
            exit 1
          fi

          echo "CI Pipeline completed successfully!"
